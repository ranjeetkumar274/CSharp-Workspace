<h1>Confirm Delete</h1>

<div>

<label>Id: </label>
<h3>{{obj.id}}</h3>

<label>Course Name: </label>
<h3>{{obj.courseName}}</h3>

<label>Instructor Name: </label>
<h3>{{obj.instructorName}}</h3>

<label>Start Date: </label>
<h3>{{obj.startDate}}</h3>

<br/>

<button type="submit" (click)="confirmDelete(obj.id)">Delete</button>
<button type="submit" (click)="cancelDelete()">Cancel</button>
</div>
