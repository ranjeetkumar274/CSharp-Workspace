<h2>{{ isEditMode ? 'Update Feedback' : 'Add Feedback'}}</h2>

<form (ngSubmit)="addFeedback()" #feedbackForm="ngForm">

    <div>
        <label>Enter ID:</label>
        <input type="number" name="id" [(ngModel)]="obj.id" required/>
        <div class="error-message" *ngIf="feedbackForm.submitted && !obj.id">Enter valid Id</div>
    </div>

    <div>
        <label>Course Name:</label>
        <input type="text" name="courseName" [(ngModel)]="obj.courseName" required/>
        <div class="error-message" *ngIf="feedbackForm.submitted && !obj.courseName">Enter valid Name</div>
    </div>

    <div>
        <label>Instructor Name:</label>
        <input type="text" name="instructorName" [(ngModel)]="obj.instructorName" required/>
        <div class="error-message" *ngIf="feedbackForm.submitted && !obj.instructorName">Enter valid Name</div>
    </div>

    <div>
        <label>Start Date:</label>
        <input type="text" name="startDate" [(ngModel)]="obj.startDate" required/>
        <div class="error-message" *ngIf="feedbackForm.submitted && !obj.startDate">Enter valid Date</div>
    </div>

    <button type="submit" (click)="addFeedback()">{{ isEditMode ? 'Update' : 'Add'}}</button>

</form>
